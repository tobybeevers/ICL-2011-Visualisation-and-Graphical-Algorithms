<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Specifies the character encoding for the document -->
        <meta charset="UTF-8">
        <!-- Ensures the page is responsive and scales properly on different devices -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Sets the title of the webpage -->
        <title>Video Game Sales Dashboard</title>
        <!-- Includes the Chart.js library for creating charts directly from the CDN-->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

        <style>
            /* Sets the default font and layout for the body text */
            body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
            /* Sets the default font and layout for the main heading */
            h1 { text-align: center; }
            h2 { text-align: right; margin: 10px 0; }

            /* Sets the default chart container to centre it and set width constraints */
            .chart-container { 
                margin: 20px 0;
                width: 50%;
                max-width: 1000px;
                margin: 0 auto;
            }
            /* Styles for the control elements like sliders and selectors */
            .controls { margin: 10px 0; }


            /* Sets a fixed height for the stacked bar chart */
            #stacked-bar-chart { height: 400px; }
            /* Sets a fixed height for the doughnut chart */
            #doughnut-chart { height: 150px; }
            /* Sets the width of the year slider */
            #year-slider { width: 500px; }
        </style>
    </head>

    <body>
        <!-- Main heading of the dashboard, using CSS h1 -->
        <h1>Video Game Sales (1985-2023)</h1>
        
        <!-- Container for the stacked bar chart -->
        <div class="chart-container">
            <!-- Subheading for the chart using CSS h2-->
            <h2>Yearly Sales by Region</h2>

            <!-- Controls for adjusting the year range -->
            <div class="controls">
                <!-- Label for the year slider -->
                <label>Year Range: </label>
                <!-- Input slider to select the year range, nb. step= is used to define the number of years the slider will move -->
                <input type="range" id="year-slider" min="1985" max="2020" step="1" value="">
                <span id="year-display"></span>
            </div>
            <!-- Canvas element where the stacked bar chart will be rendered -->
            
            <canvas id="stacked-bar-chart"></canvas>
        </div>
        
        <!-- Container for the doughnut chart -->
        <div class="chart-container">
            <!-- Subheading for the chart using CSS h2-->
            <h2>Genre Popularity</h2>

            <!-- Controls for selecting a specific year -->
            <div class="controls">
                <!-- Label for the year selector dropdown -->
                <label>Select Year: </label>
                <!-- Dropdown menu to select a year -->
                <select id="genre-year-selector">
                </select>
                <!-- Span to display the selected year -->
                
            </div>
            <!-- Canvas element where the doughnut chart will be rendered -->
            <canvas id="doughnut-chart"></canvas>
        </div>

        <!-- Links the external JavaScript file for functionality -->
        <script src="script.js"></script>
        
                <!-- Footer container for data source attribution -->
                <footer style="text-align: center; margin-top: 20px; font-size: 1.2em; color: gray;">
                    Data source: <a href="https://www.kaggle.com/code/snanilim/video-games-sales-analysis-and-visualization" target="_blank" rel="noopener noreferrer">kaggle</a>
                </footer>
            </body>
        </html>
    </body>
</html>
